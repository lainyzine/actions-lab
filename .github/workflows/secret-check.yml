name: Secret check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mismatched name
        run: echo "mismatched length is ${#VALUE}"
        env:
          VALUE: ${{ secrets.DEMO_TOKEN }}
      - name: Lowercase name
        run: echo "lowercase length is ${#VALUE}"
        env:
          VALUE: ${{ secrets.demo_key }}

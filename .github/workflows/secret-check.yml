name: Secret check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Show length
        run: echo "length: ${#DEMO_KEY}"
        env:
          DEMO_KEY: ${{ secrets.DEMO_KEY }}
      - name: Print value
        run: echo "$DEMO_KEY"
        env:
          DEMO_KEY: ${{ secrets.DEMO_KEY }}

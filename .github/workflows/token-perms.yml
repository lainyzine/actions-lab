name: Token check
on: push
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create issue with gh api
        run: gh api -i -X POST repos/${{ github.repository }}/issues -f title="Token test"
        env:
          GH_TOKEN: ${{ github.token }}
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create issue with gh issue
        run: gh issue create --title "Token test" --body "Created from Actions"
        env:
          GH_TOKEN: ${{ github.token }}

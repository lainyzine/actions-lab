name: Token check
on: push
permissions:
  contents: read
jobs:
  issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Create issue with gh issue
        run: gh issue create --title "Token test" --body "Created from Actions"
        env:
          GH_TOKEN: ${{ github.token }}
